<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리엔장 병원 HR 도우미</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#0d9488;--teal2:#0f766e;--teal-light:#ccfbf1;--teal-bg:#f0fdfa;
  --bg:#f0fdfa;--border:#99f6e4;--text:#134e4a;--surface:#fff;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 20px;}

#chatbot{display:flex;flex-direction:column;height:740px;width:660px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 8px 32px rgba(13,148,136,0.1);}
#hdr{padding:14px 18px;background:linear-gradient(135deg,#0d9488 0%,#0284c7 100%);display:flex;align-items:center;gap:12px;flex-shrink:0;}
#hdr-icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
#hdr-info{flex:1;}
#hdr-title{font-size:15px;font-weight:700;color:#fff;}
#hdr-sub{font-size:11.5px;color:rgba(255,255,255,0.75);margin-top:2px;}
#hdr-sync{padding:5px 11px;border:1px solid rgba(255,255,255,0.35);border-radius:7px;background:rgba(255,255,255,0.12);color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;transition:background 0.15s;}
#hdr-sync:hover{background:rgba(255,255,255,0.22);}
#hdr-sync.syncing{opacity:0.7;cursor:not-allowed;}

#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg-bot{display:flex;gap:9px;align-items:flex-start;}
.bot-av{width:30px;height:30px;border-radius:50%;background:var(--teal-light);color:var(--teal2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px;}
.bot-bbl{background:var(--teal-bg);border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:11px 15px;font-size:13.5px;color:var(--text);line-height:1.65;max-width:88%;}
.msg-user{display:flex;justify-content:flex-end;}
.user-bbl{background:var(--teal);color:#fff;border-radius:12px 0 12px 12px;padding:10px 15px;font-size:13.5px;line-height:1.6;max-width:80%;}
.widget{padding-left:39px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0;}
.cat-btn{padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:13px;color:var(--text);text-align:left;transition:all 0.15s;display:flex;align-items:center;gap:7px;font-weight:500;}
.cat-btn:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal2);}
.q-list{display:flex;flex-direction:column;gap:7px;padding:4px 0;}
.q-btn{padding:9px 13px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;color:var(--text);text-align:left;transition:all 0.15s;line-height:1.45;}
.q-btn:hover{background:var(--teal-light);border-color:var(--teal);}
.sub-btn{display:flex;align-items:center;justify-content:space-between;}
.sub-cnt{font-size:11px;color:#64748b;background:#f1f5f9;border-radius:20px;padding:2px 8px;flex-shrink:0;}
.nav-btns{display:flex;gap:7px;margin-top:2px;}
.back-btn{padding:6px 13px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:12px;color:#64748b;display:inline-flex;align-items:center;gap:4px;}
.back-btn:hover{background:#f1f5f9;}
.answer-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 15px;font-size:13.5px;color:#14532d;line-height:1.75;}
.info-box{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:9px 13px;font-size:12px;color:#78350f;margin-top:7px;line-height:1.6;}
.loading-dots{display:flex;gap:5px;align-items:center;padding:4px 0;}
.loading-dots span{width:8px;height:8px;background:var(--teal);border-radius:50%;animation:bounce 1.2s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:scale(0.8);opacity:0.5;}40%{transform:scale(1.1);opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner-inline{width:12px;height:12px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
#err-banner{display:none;background:#fef2f2;border-bottom:1px solid #fecaca;padding:9px 16px;font-size:12px;color:#991b1b;align-items:center;gap:8px;flex-shrink:0;}
#err-banner.show{display:flex;}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);z-index:9999;background:#1e293b;color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div id="chatbot">
  <div id="hdr">
    <div id="hdr-icon">🏥</div>
    <div id="hdr-info">
      <div id="hdr-title">리엔장 병원 HR 도우미</div>
      <div id="hdr-sub">임직원 문의 응대 시스템 · 리엔장 전용</div>
    </div>
    <button id="hdr-sync" onclick="manualSync()" title="데이터 새로고침">🔄 새로고침</button>
  </div>
  <div id="err-banner"><span id="err-msg"></span></div>
  <div id="msgs"></div>
</div>
<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmYrZZqdNxofFPqQ42uCnwO8vCaz_Nbss0YNa4kZjSEK98IUVRNB7ljl14wrG7x2iIfQ/exec';

// ── 아이콘 매핑 ──
const ICON_MAP = {

  '승진':'⬆️','인사':'⬆️','IT':'💻','비품':'💻',
};

  for(const [k,v] of Object.entries(ICON_MAP)){ if(label.includes(k)) return v; }
  return '📌';
}

// ── 기본 데이터 (구글 시트 로드 실패 시 폴백) ──
let DATA = {
  cats:[
    { id:'급여', icon:'💰', label:'급여', subs:[
      { label:'급여 지급', qs:[
        {q:'급여일이 언제예요?', a:'매월 1일~말일 급여가 다음 달 5일에 지급됩니다.\n5일이 휴일이면 전일 지급합니다.', info:''},
        {q:'입사일이 1일이 아니면 급여가 어떻게 계산되나요?', a:'근무한 일수만큼 일할 계산하여 지급됩니다.\n예) 4월 14일 입사 = 14~30일 총 17일분 지급', info:''},
        {q:'점심 식대가 따로 나오나요?', a:'비과세 식대 200,000원이 지급됩니다(계약 연봉에 포함)', info:''},
      ]},
      { label:'4대 보험', qs:[
        {q:'입사 후 건강보험 고지서를 받았어요', a:'1일 입사자가 아닌 경우 입사 당월에는 건강보험료를 급여에서 공제하지 않습니다.\n입사 당월은 지역가입자로 보험료가 부과되기 때문입니다.\n미공제분은 퇴사 시 또는 다음 해 4월에 재정산됩니다.', info:''},
        {q:'출산휴가·육아휴직 중 4대보험은 어떻게 되나요?', a:'[출산휴가 기간]\n• 국민연금, 고용보험, 산재보험 → 유예\n• 건강보험 → 정상 납부\n\n[육아휴직 기간]\n• 모든 4대보험 → 전부 유예\n\n※ 유예 기간 중 정산분이 발생할 수 있으며, 복직 후 일괄 정산될 수 있습니다.', info:'담당자: HR팀 이지현 주임'},
        {q:'입사 시 4대보험 공제는 언제부터 되나요?', a:'• 1일 입사자: 당월분 공제 대상\n• 1일 이후 입사자: 당월분 미공제 (익월부터 공제)', info:''},
        {q:'건강보험 피부양자 등록은 어떻게 하나요?', a:'자격 조건 확인 후 가족관계증명서 상세(주민등록번호 뒷자리 공개)를 인사팀에 제출합니다.', info:'문의: 인사팀'},
      ]},
      { label:'인센티브', qs:[
        {q:'인센티브 지급일은 언제예요?', a:'매월 15일\n15일이 휴일이면 다음날에 지급', info:''},

    { id:'휴가·휴일', icon:'🌴', label:'휴가·휴일', subs:[

        {q:'올해 연차를 다 쓰면 내년 연차를 당겨 쓸 수 있나요?', a:'내년도 연차 선사용은 불가합니다.\n\n연차를 모두 소진하신 경우, 무급휴가를 HR팀 및 해당 부서장 승인 후 사용하실 수 있습니다.\n무급휴가 사용 시 해당 일수만큼 급여에서 공제됩니다.', info:''},

        {q:'퇴사 시 미사용 연차는 보상받을 수 있나요?', a:'네, 퇴사 시 잔여 연차에 대해서는 연차수당으로 정산받으실 수 있습니다.', info:''},
      ]},
      { label:'공휴일 근무', qs:[
        {q:'법정공휴일에도 근무하나요?', a:'병원 특성상 공휴일에도 근무할 수 있습니다.\n원내 스케줄에 따라 근무자가 결정됩니다.', info:'공휴일 근무 시: 1.5개 대체휴가 또는 1.5배 휴일근무수당 선택'},

      { label:'경조 휴가', qs:[

        {q:'본인 결혼 시 경조 휴가는?', a:'[회사]\n• 경조 휴가: 5일 (발생일로부터 휴일 포함 산정)\n• 경조금: 근속 6개월~1년 30만원 / 1년 이상 50만원\n• 화환 지원\n\n2주 전 결재\n구비서류: 청첩장', info:''},
        {q:'배우자 사망 시 경조 휴가는?', a:'[회사]\n• 경조 휴가: 5일 (발생일로부터 휴일 포함 산정)\n• 경조금: 100만원\n• 화환 지원\n\n사후 1개월 이내 결재', info:''},

      { label:'특별 복지', qs:[

    ]},
    { id:'출장비', icon:'✈️', label:'출장비', subs:[
      { label:'국내 출장', qs:[
        {q:'국내 출장비 기준은?', a:'[숙박비 - 실비 정산]\n• 원장: 100,000원 한도\n• 직원: 70,000원 한도\n\n[식대 - 1식]\n• 원장: 12,000원\n• 직원: 9,000원\n\n[교통] 실비 정산 원칙\n\n※ 당일 출장 시 숙박비 미지급', info:'복귀 후 14일 이내 정산 / 증빙자료 제출 필수'},
      ]},
      { label:'해외 출장', qs:[
        {q:'해외 출장 일비 기준은?', a:'[그룹B - 원장]\n• 가(미국/유럽 등): 120,000원\n• 나(일본/중국 등): 100,000원\n• 다(동남아 등): 80,000원\n\n[그룹C - 직원]\n• 가: 100,000원\n• 나: 80,000원\n• 다: 60,000원\n\n※ 숙박·식대·현지 교통비 포함', info:'도착일 14시 이전 도착 시 당일 일비 1/2 지급'},
      ]},
      { label:'신청·정산 절차', qs:[
        {q:'출장 신청·정산 절차는?', a:'① 출장신청서 상신\n   국내: 3영업일 전 / 해외: 7영업일 전\n② 항공·숙박 예약 (Economy·3성급 원칙)\n③ 출장 수행 (영수증 전부 수취)\n④ 복귀 후 14일 이내 정산\n   출장 보고서 + 증빙자료 제출', info:''},
      ]},
    ]},
  ]
};

// ── Apps Script JSON → DATA 변환 ──
// Apps Script가 반환하는 형식: [[행1col1, 행1col2, ...], [행2col1, ...], ...]
// 컬럼 순서: 사업장(0) | 대카테고리(1) | 소카테고리(2) | 질문(3) | 답변(4) | 더알아보기(5) | 삭제여부(6)
function buildDataFromJSON(rows) {
  const catMap = {};
  const dataRows = rows.filter(r => {
    if (!r || r.length < 4) return false;
    const biz = String(r[0]||'').trim();
    const big = String(r[1]||'').trim();
    // 헤더행 제외, 리엔장 데이터만
    return biz.includes('리엔장') ||
      (biz === '' && big !== '' && big !== '대카테고리' && big !== '사업장');
  });
  dataRows.forEach(r => {
    const bigCat  = String(r[1]||'').trim();
    const smallCat= String(r[2]||'').trim();
    const q       = String(r[3]||'').trim();
    const a       = String(r[4]||'').trim();
    const info    = String(r[5]||'').trim();
    const delFlag = String(r[6]||'').trim();
    if (!bigCat || !q || !a || delFlag === '삭제') return;
    if (!catMap[bigCat]) catMap[bigCat] = { id:bigCat, icon:getIcon(bigCat), label:bigCat, subsMap:{} };
    const subKey = smallCat || bigCat;
    if (!catMap[bigCat].subsMap[subKey]) catMap[bigCat].subsMap[subKey] = { label:subKey, qs:[] };
    catMap[bigCat].subsMap[subKey].qs.push({ q, a, info });
  });
  return { cats: Object.values(catMap).map(c => ({ ...c, subs: Object.values(c.subsMap) })) };
}

// ── 동기화 ──
async function syncData(silent = false) {
  const btn = document.getElementById('hdr-sync');
  btn.classList.add('syncing');
  btn.innerHTML = '<span class="spinner-inline"></span> 로딩중';
  btn.disabled = true;
  try {
    const res = await fetch(APPS_SCRIPT_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('데이터 형식 오류');
    const newData = buildDataFromJSON(rows);
    if (newData.cats.length) {
      DATA.cats = newData.cats;
      document.getElementById('err-banner').classList.remove('show');
      const now = new Date();
      document.getElementById('hdr-sub').textContent =
        `마지막 업데이트 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} · 리엔장 전용`;
      if (!silent) toast('✅ 최신 데이터로 업데이트되었습니다.');
    } else throw new Error('데이터 없음');
  } catch(e) {
    document.getElementById('err-banner').classList.add('show');
    document.getElementById('err-msg').textContent = `⚠️ 데이터 로드 실패 — 기본 데이터로 표시 중 (${e.message})`;
    if (!silent) toast('⚠️ 데이터를 불러오지 못했습니다.');
  }
  btn.classList.remove('syncing');
  btn.innerHTML = '🔄 새로고침';
  btn.disabled = false;
  initChat();
}
async function manualSync(){ await syncData(false); }

// ── 챗봇 UI ──
let chatState = 'cats', curCatIdx = null;
function $m(){ return document.getElementById('msgs'); }
function addBot(html){
  const d = document.createElement('div'); d.className='msg-bot';
  d.innerHTML=`<div class="bot-av">🏥</div><div class="bot-bbl">${html}</div>`;
  $m().appendChild(d); $m().scrollTop=$m().scrollHeight;
}
function addUser(t){
  const d=document.createElement('div'); d.className='msg-user';
  d.innerHTML=`<div class="user-bbl">${t}</div>`;
  $m().appendChild(d); $m().scrollTop=$m().scrollHeight;
}
function addWidget(html){
  const d=document.createElement('div'); d.className='widget'; d.innerHTML=html;
  $m().appendChild(d); $m().scrollTop=$m().scrollHeight;
}

// ── 1단계: 대카테고리 ──
function showCats(){
  chatState='cats';
  let g='<div class="cat-grid">';
  DATA.cats.forEach((c,i)=>{ g+=`<button class="cat-btn" onclick="selectCat(${i})">${c.icon} ${c.label}</button>`; });
  g+='</div>'; addWidget(g);
}

// ── 2단계: 소카테고리 ──
function selectCat(ci){
  chatState='subs';
  const cat=DATA.cats[ci];
  addUser(`${cat.icon} ${cat.label}`);
  addBot(`<b>${cat.label}</b>의 세부 항목을 선택해 주세요:`);
  let html=`<button class="back-btn" onclick="showCats()">← 카테고리로</button><div class="q-list" style="margin-top:7px">`;
  (cat.subs||[]).forEach((sub,si)=>{
    // 소카테고리에 속한 질문 수 표시
    const cnt=sub.qs.length;
    html+=`<button class="q-btn sub-btn" onclick="selectSub(${ci},${si})">
      <span>${sub.label}</span>
      <span class="sub-cnt">${cnt}개</span>
    </button>`;
  });
  html+='</div>'; addWidget(html);
}

// ── 3단계: 질문 목록 ──
function selectSub(ci,si){
  chatState='qs';
  const cat=DATA.cats[ci], sub=cat.subs[si];
  addUser(sub.label);
  addBot(`<b>${sub.label}</b> 관련 자주 묻는 질문입니다:`);
  let html=`<div class="nav-btns" style="margin-bottom:8px">
    <button class="back-btn" onclick="showCats()">🏠 카테고리로</button>
    <button class="back-btn" onclick="selectCat(${ci})">← ${cat.label}으로</button>
  </div><div class="q-list">`;
  sub.qs.forEach((q,qi)=>{
    html+=`<button class="q-btn" onclick="selectQ(${ci},${si},${qi})">${q.q}</button>`;
  });
  html+='</div>'; addWidget(html);
}

// ── 4단계: 답변 ──
function selectQ(ci,si,qi){
  chatState='ans';
  const cat=DATA.cats[ci], sub=cat.subs[si], q=sub.qs[qi];
  addUser(q.q);
  let aHtml=`<div class="answer-box">${q.a.replace(/\n/g,'<br>')}</div>`;
  if(q.info) aHtml+=`<div class="info-box">ℹ️ ${q.info.replace(/\n/g,'<br>')}</div>`;
  addBot(aHtml);
  addWidget(`<div class="nav-btns">
    <button class="back-btn" onclick="selectSub(${ci},${si})">← 다른 질문 보기</button>
    <button class="back-btn" onclick="selectCat(${ci})">↑ ${cat.label}</button>
    <button class="back-btn" onclick="showCats()">🏠 처음으로</button>
  </div>`);
}

function initChat(){
  $m().innerHTML=''; chatState='cats';
  addBot(`안녕하세요! <b>리엔장 병원 HR 도우미</b>입니다. 👋<br>아래 카테고리에서 궁금한 항목을 선택해 주세요.`);
  showCats();
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ── 초기화 ──
(async function(){ initChat(); await syncData(true); })();
</script>
